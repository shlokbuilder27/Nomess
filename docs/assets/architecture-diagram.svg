<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:ital,wght@0,600&amp;display=swap');
      .sans { font-family: 'Inter', -apple-system, sans-serif; }
      .serif { font-family: 'Newsreader', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A1A18" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="420" fill="#F4F4EE" />

  <!-- Diagram Title -->
  <text x="50" y="45" class="serif" font-size="22" font-weight="600" fill="#1A1A18">Nomess First-Principles System Architecture</text>
  <text x="50" y="65" class="mono" font-size="11" fill="#7E7C75">ZERO-LOCALHOST TAURI V2 + RUST ENGINE &bull; LOCAL-FIRST MARKDOWN VAULT</text>

  <!-- Flow Columns -->
  <!-- 1. Input Modalities -->
  <g transform="translate(50, 95)" filter="url(#shadow)">
    <rect width="160" height="280" rx="8" fill="#FFFFFF" stroke="#D8D6CD" />
    <rect width="160" height="32" rx="8" fill="#EAE8E0" />
    <rect y="24" width="160" height="8" fill="#EAE8E0" />
    <text x="12" y="21" class="mono" font-size="10" font-weight="600" fill="#1A1A18">1. INGESTION</text>

    <!-- Card A -->
    <rect x="12" y="44" width="136" height="60" rx="6" fill="#FBFBF9" stroke="#E6E4DC" />
    <text x="22" y="66" class="sans" font-size="11" font-weight="600" fill="#1A1A18">Raw Braindump</text>
    <text x="22" y="80" class="sans" font-size="9" fill="#7E7C75">Unstructured thoughts,</text>
    <text x="22" y="92" class="sans" font-size="9" fill="#7E7C75">transcripts, fragments</text>

    <!-- Card B -->
    <rect x="12" y="116" width="136" height="74" rx="6" fill="#FBFBF9" stroke="#E6E4DC" />
    <text x="22" y="138" class="sans" font-size="11" font-weight="600" fill="#C84B31">Photo Scan / OCR</text>
    <text x="22" y="152" class="sans" font-size="9" fill="#7E7C75">Handwritten notebooks,</text>
    <text x="22" y="164" class="sans" font-size="9" fill="#7E7C75">whiteboard captures,</text>
    <text x="22" y="176" class="sans" font-size="9" fill="#7E7C75">book page margins</text>

    <!-- Card C -->
    <rect x="12" y="202" width="136" height="60" rx="6" fill="#FBFBF9" stroke="#E6E4DC" />
    <text x="22" y="224" class="sans" font-size="11" font-weight="600" fill="#1A1A18">10 Templates</text>
    <text x="22" y="238" class="sans" font-size="9" fill="#7E7C75">Cornell, Feynman,</text>
    <text x="22" y="250" class="sans" font-size="9" fill="#7E7C75">Carmack Spec, etc.</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 220 235 L 260 235" stroke="#C84B31" stroke-width="2" stroke-dasharray="4" />
  <polygon points="262,235 256,231 256,239" fill="#C84B31" />

  <!-- 2. AI Intelligence Engine -->
  <g transform="translate(270, 95)" filter="url(#shadow)">
    <rect width="180" height="280" rx="8" fill="#FFFFFF" stroke="#D8D6CD" />
    <rect width="180" height="32" rx="8" fill="#EAE8E0" />
    <rect y="24" width="180" height="8" fill="#EAE8E0" />
    <text x="12" y="21" class="mono" font-size="10" font-weight="600" fill="#1A1A18">2. SYNTHESIS ENGINE</text>

    <!-- Engine A -->
    <rect x="12" y="44" width="156" height="96" rx="6" fill="#FBFBF9" stroke="#E6E4DC" />
    <text x="22" y="66" class="sans" font-size="11" font-weight="600" fill="#1A1A18">Gemini Flash (Vision)</text>
    <text x="22" y="80" class="sans" font-size="9" fill="#7E7C75">&bull; Strict single-shot JSON</text>
    <text x="22" y="94" class="sans" font-size="9" fill="#7E7C75">&bull; Multimodal vision OCR</text>
    <text x="22" y="108" class="sans" font-size="9" fill="#7E7C75">&bull; Sub-150 token budget</text>
    <text x="22" y="122" class="mono" font-size="8" fill="#3C6351">Ultra-low token spend</text>

    <!-- Engine B -->
    <rect x="12" y="152" width="156" height="110" rx="6" fill="#FBFBF9" stroke="#E6E4DC" />
    <text x="22" y="174" class="sans" font-size="11" font-weight="600" fill="#1A1A18">Local Air-Gapped Mode</text>
    <text x="22" y="188" class="sans" font-size="9" fill="#7E7C75">&bull; Local Ollama (llama3.2)</text>
    <text x="22" y="202" class="sans" font-size="9" fill="#7E7C75">&bull; 100% offline privacy</text>
    <text x="22" y="216" class="sans" font-size="9" fill="#7E7C75">&bull; Zero packets sent</text>
    <text x="22" y="234" class="sans" font-size="9" fill="#7E7C75">&bull; Offline heuristic fill</text>
    <text x="22" y="248" class="mono" font-size="8" fill="#C84B31">Zero-cost fallback</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 460 235 L 500 235" stroke="#C84B31" stroke-width="2" stroke-dasharray="4" />
  <polygon points="502,235 496,231 496,239" fill="#C84B31" />

  <!-- 3. Tauri v2 Desktop Engine -->
  <g transform="translate(510, 95)" filter="url(#shadow)">
    <rect width="190" height="280" rx="8" fill="#FFFFFF" stroke="#D8D6CD" />
    <rect width="190" height="32" rx="8" fill="#1A1A18" />
    <text x="12" y="21" class="mono" font-size="10" font-weight="600" fill="#FBFBF9">3. TAURI V2 RUST CORE</text>

    <rect x="12" y="44" width="166" height="54" rx="6" fill="#FBFBF9" stroke="#E6E4DC" />
    <text x="22" y="66" class="sans" font-size="11" font-weight="600" fill="#1A1A18">Native OS Window</text>
    <text x="22" y="80" class="sans" font-size="9" fill="#7E7C75">Direct WebView2 IPC channel</text>
    <text x="22" y="92" class="mono" font-size="8" fill="#3C6351">Zero localhost server</text>

    <rect x="12" y="108" width="166" height="54" rx="6" fill="#FBFBF9" stroke="#E6E4DC" />
    <text x="22" y="130" class="sans" font-size="11" font-weight="600" fill="#1A1A18">Vault File Manager</text>
    <text x="22" y="144" class="sans" font-size="9" fill="#7E7C75">Atomic UTF-8 disk writes</text>
    <text x="22" y="156" class="sans" font-size="9" fill="#7E7C75">RFC-822 / YAML frontmatter</text>

    <rect x="12" y="172" width="166" height="90" rx="6" fill="#FBFBF9" stroke="#E6E4DC" />
    <text x="22" y="194" class="sans" font-size="11" font-weight="600" fill="#1A1A18">Dieter Rams Canvas</text>
    <text x="22" y="208" class="sans" font-size="9" fill="#7E7C75">&bull; Newsreader serif</text>
    <text x="22" y="222" class="sans" font-size="9" fill="#7E7C75">&bull; Inter Swiss grotesque</text>
    <text x="22" y="236" class="sans" font-size="9" fill="#7E7C75">&bull; Archival laid cotton tint</text>
    <text x="22" y="250" class="mono" font-size="8" fill="#1A1A18">#FBFBF9 Canvas</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 710 235 L 750 235" stroke="#C84B31" stroke-width="2" stroke-dasharray="4" />
  <polygon points="752,235 746,231 746,239" fill="#C84B31" />

  <!-- 4. Storage & Outputs -->
  <g transform="translate(760, 95)" filter="url(#shadow)">
    <rect width="190" height="280" rx="8" fill="#FFFFFF" stroke="#D8D6CD" />
    <rect width="190" height="32" rx="8" fill="#EAE8E0" />
    <rect y="24" width="190" height="8" fill="#EAE8E0" />
    <text x="12" y="21" class="mono" font-size="10" font-weight="600" fill="#1A1A18">4. PERSIST &amp; SYNC</text>

    <!-- Out A -->
    <rect x="12" y="44" width="166" height="66" rx="6" fill="#FBFBF9" stroke="#E6E4DC" />
    <text x="22" y="66" class="sans" font-size="11" font-weight="600" fill="#1A1A18">Local Plain Markdown</text>
    <text x="22" y="80" class="sans" font-size="9" fill="#7E7C75">Stored in ~/Nomess_Vault</text>
    <text x="22" y="92" class="sans" font-size="9" fill="#7E7C75">Obsidian &amp; Git compatible</text>
    <text x="22" y="104" class="mono" font-size="8" fill="#3C6351">Zero lock-in forever</text>

    <!-- Out B -->
    <rect x="12" y="118" width="166" height="66" rx="6" fill="#FBFBF9" stroke="#E6E4DC" />
    <text x="22" y="140" class="sans" font-size="11" font-weight="600" fill="#3C6351">Google Drive Mirror</text>
    <text x="22" y="154" class="sans" font-size="9" fill="#7E7C75">Auto-synced to phone folder</text>
    <text x="22" y="166" class="sans" font-size="9" fill="#7E7C75">Open on mobile instantly</text>
    <text x="22" y="178" class="mono" font-size="8" fill="#3C6351">Read on phone</text>

    <!-- Out C -->
    <rect x="12" y="192" width="166" height="70" rx="6" fill="#FBFBF9" stroke="#E6E4DC" />
    <text x="22" y="214" class="sans" font-size="11" font-weight="600" fill="#C84B31">Editorial Print Suite</text>
    <text x="22" y="228" class="sans" font-size="9" fill="#7E7C75">Calibrated A4 / Letter PDF</text>
    <text x="22" y="240" class="sans" font-size="9" fill="#7E7C75">Zero orphan headers</text>
    <text x="22" y="254" class="mono" font-size="8" fill="#C84B31">Physical binder ready</text>
  </g>
</svg>
