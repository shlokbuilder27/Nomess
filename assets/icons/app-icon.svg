<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- 2D Minimalist Astronaut Logo — Shlok's Anti-AI-Slop Palette -->

  <!-- App Rounded Icon Container -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="#2D312E" stroke="#D4A373" stroke-width="4"/>

  <!-- Orbital Circle Accent (Tilted 2D Halo) -->
  <circle cx="128" cy="130" r="92" stroke="#E9EDC9" stroke-width="3" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="48" cy="88" r="5" fill="#D4A373"/>

  <!-- Minimal 2D Star Sparkles -->
  <circle cx="62" cy="52" r="2.5" fill="#FEFAE0"/>
  <circle cx="204" cy="68" r="3" fill="#D4A373"/>
  <circle cx="218" cy="180" r="2.5" fill="#FEFAE0"/>
  <circle cx="46" cy="195" r="2" fill="#E9EDC9"/>

  <!-- Four-point geometric star -->
  <path d="M190 42 Q190 52 200 52 Q190 52 190 62 Q190 52 180 52 Q190 52 190 42 Z" fill="#D4A373"/>

  <!-- Life Support Backpack / Collar Base (2D) -->
  <rect x="76" y="86" width="104" height="110" rx="20" fill="#CCD5AE" stroke="#2D312E" stroke-width="6"/>
  <rect x="94" y="172" width="68" height="28" rx="8" fill="#D4A373"/>

  <!-- Comms Antenna (Top Right) -->
  <line x1="168" y1="84" x2="186" y2="52" stroke="#D4A373" stroke-width="5" stroke-linecap="round"/>
  <circle cx="188" cy="48" r="6" fill="#FEFAE0" stroke="#D4A373" stroke-width="3"/>

  <!-- Astronaut Suit Shoulders / Torso (2D) -->
  <path d="M52 226 C52 186, 78 174, 96 170 L160 170 C178 174, 204 186, 204 226 Z" fill="#FEFAE0" stroke="#2D312E" stroke-width="6"/>

  <!-- Chest Control Badge -->
  <rect x="110" y="184" width="36" height="24" rx="6" fill="#2D312E"/>
  <circle cx="120" cy="196" r="3" fill="#D4A373"/>
  <circle cx="136" cy="196" r="3" fill="#E9EDC9"/>

  <!-- Helmet Outer Ring (2D Sphere) -->
  <circle cx="128" cy="116" r="54" fill="#FEFAE0" stroke="#2D312E" stroke-width="6"/>

  <!-- Helmet Audio Earpieces -->
  <rect x="68" y="104" width="8" height="24" rx="4" fill="#D4A373" stroke="#2D312E" stroke-width="3"/>
  <rect x="180" y="104" width="8" height="24" rx="4" fill="#D4A373" stroke="#2D312E" stroke-width="3"/>

  <!-- Large Iconic 2D Visor (Golden Amber with clean geometric cut) -->
  <rect x="88" y="92" width="80" height="48" rx="22" fill="#D4A373" stroke="#2D312E" stroke-width="5"/>

  <!-- Visor Minimal 2D Reflection Highlight (Crescent arc of pure light) -->
  <path d="M100 102 C108 96, 126 96, 142 98 C144 102, 134 104, 118 104 C108 104, 102 108, 100 102 Z" fill="#FEFAE0"/>
  <circle cx="154" cy="104" r="3.5" fill="#FEFAE0"/>
</svg>
